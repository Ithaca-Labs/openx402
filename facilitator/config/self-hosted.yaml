server:
  port: 4022

database_url_env: DATABASE_URL
api_keys_env: FACILITATOR_API_KEYS
key_encryption_key_env: FACILITATOR_KEY_ENCRYPTION_KEY

indexing:
  auto_catalog: true
  index_on: verified
  require_valid_schema: true
  duplicate_changed: version_and_verify
  stale_after_hours: 168
  max_metadata_bytes: 131072
  max_description_length: 4000
  max_schema_bytes: 65536
  max_example_bytes: 16384
  max_json_depth: 32
  max_tags: 5
  max_tag_length: 32
  max_icon_url_length: 2048
  max_service_name_length: 32
  max_route_template_length: 512
  # Icons are never fetched during request processing; only the URL is stored.
  fetch_icons: false
  inactive_version_retention_days: 365
  catalog_observation_retention_days: 90

catalog_security:
  require_https_origins: true
  # This checked-in profile is the local testnet/E2E profile, where servers run
  # on loopback. Both of the following must stay false on pubnet, and startup
  # refuses to enable pubnet while allow_local_origins is true.
  allow_local_origins: true

discovery:
  enabled: true
  default_page_size: 20
  max_page_size: 50
  cursor_ttl_minutes: 15
  include_stale: false
  include_unverified: false
  cursor_hmac_key_env: FACILITATOR_CURSOR_HMAC_KEY

search:
  lexical:
    enabled: true
    # `simple` avoids language guessing; set `english` for stemming and stopword
    # removal on a mostly-English catalog.
    language: simple
    weight: 0.7
    candidate_count: 250
  semantic:
    enabled: true
    # disabled | local | remote. `local` needs the optional runtime:
    #   npm install @huggingface/transformers
    # Without it the facilitator boots and serves lexical results, and
    # /health/ready reports exactly what is missing.
    provider: local
    model: BAAI/bge-m3
    # transformers.js ONNX export of BAAI/bge-m3 (MIT), pinned by commit sha.
    repo: Xenova/bge-m3
    revision: 4de13258303883538bd53b696b452bf8099f0858
    dimension: 1024
    pooling: cls
    normalization: l2
    weight: 0.3
    timeout_ms: 500
    candidate_count: 250
    max_distance: 0.9
    remote_url_env: FACILITATOR_EMBEDDING_URL
    remote_api_key_env: FACILITATOR_EMBEDDING_API_KEY
  reranking:
    # Off by default. No ONNX export of BAAI/bge-reranker-v2-m3 is published for
    # the local runtime, so `repo` must point at your own export or `provider`
    # must be `remote`. See docs/SEARCH.md.
    enabled: false
    provider: local
    model: BAAI/bge-reranker-v2-m3
    repo: ""
    revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
    top_k: 30
    timeout_ms: 800
    fallback_to_hybrid: true
    remote_url_env: FACILITATOR_RERANKER_URL
    remote_api_key_env: FACILITATOR_RERANKER_API_KEY
  rrf_k: 20
  minimum_relevance_score: 0
  # Omitted: inherits discovery.default_page_size / discovery.max_page_size.
  origin_diversity_limit: 3
  impressions:
    enabled: true
    retain_query_text: false
    retention_days: 90
  models:
    cache_dir: .models
    offline: false
    dtype: q8
    require_pinned_revision: true
  indexing:
    batch_size: 32
    worker_concurrency: 1
    poll_ms: 500
    lease_ms: 30000
    max_attempts: 5
    backoff_base_ms: 1000
    backoff_max_ms: 300000
    reindex_schedule: manual

analytics:
  enabled: true
  default_page_size: 50
  max_page_size: 200
  redact_addresses: false

limits:
  max_request_bytes: 262144
  max_concurrent_simulations: 20
  max_simulations_per_key_per_minute: 30
  max_sponsored_stroops_per_key_per_day: "5000000"
  max_global_sponsored_stroops_per_day: "200000000"
  max_pending_settlements: 1000
  channel_lease_ms: 30000
  settle_poll_ms: 1000
  settle_timeout_ms: 30000

networks:
  stellar:testnet:
    enabled: true
    rpc_url: https://soroban-testnet.stellar.org
    horizon_url: https://horizon-testnet.stellar.org
    friendbot_url: https://friendbot.stellar.org
    development_auto_fund: true
    # These ceilings cover the measured testnet profiles in tests/live/testnet.ts.
    fee_ceilings_calibrated: true
    channel_account_count: 3
    channel_min_balance_stroops: "50000000"
    upto_contract: CDEI3W6ZFW6BFSU37VL265OSOGKSM3BR3TZVUR5NZ4UER6FOMVJUKOOT
    allowed_settlement_hooks: []
    max_timeout_seconds: 300
    assets:
      - contract: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
        symbol: XLM
        decimals: 7
        max_payment: "1000000000"
      - contract: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
        symbol: USDC
        decimals: 7
        max_payment: "1000000000"
    fees:
      exact:
        max_resource_fee_stroops: "50000"
        max_inclusion_fee_stroops: "200"
        max_total_fee_stroops: "50200"
      upto:
        max_resource_fee_stroops: "150000"
        max_inclusion_fee_stroops: "200"
        max_total_fee_stroops: "150200"

  stellar:pubnet:
    enabled: false
    rpc_url: https://mainnet.sorobanrpc.com
    horizon_url: https://horizon.stellar.org
    development_auto_fund: false
    # Disabled example values are not production defaults. Measure pubnet p99,
    # replace all fee ceilings, then set this to true before enabling.
    fee_ceilings_calibrated: false
    channel_account_count: 10
    channel_min_balance_stroops: "50000000"
    sponsor_secret_env: STELLAR_PUBNET_SPONSOR_SECRET
    channel_secrets_env: STELLAR_PUBNET_CHANNEL_SECRETS
    upto_contract_env: STELLAR_PUBNET_UPTO_CONTRACT
    allowed_settlement_hooks: []
    max_timeout_seconds: 300
    assets:
      - contract: CCW67TSZV3SSS2HXMBQ5JFGCKJNXKZM7UQUWUZPUTHXSTZLEO7SJMI75
        symbol: USDC
        decimals: 7
        max_payment: "1000000000"
    fees:
      exact:
        max_resource_fee_stroops: "50000"
        max_inclusion_fee_stroops: "200"
        max_total_fee_stroops: "50200"
      upto:
        max_resource_fee_stroops: "150000"
        max_inclusion_fee_stroops: "200"
        max_total_fee_stroops: "150200"

services:
  postgres:
    # pgvector ships the extension semantic search needs. Plain postgres:17
    # also works: the facilitator then runs lexical-only and says so in
    # /health/ready.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: facilitator
      POSTGRES_USER: facilitator
      POSTGRES_PASSWORD: facilitator-development-only
    volumes:
      - facilitator_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facilitator -d facilitator"]
      interval: 2s
      timeout: 2s
      retries: 20

  facilitator:
    build: .
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://facilitator:facilitator-development-only@postgres:5432/facilitator
      FACILITATOR_CONFIG: config/self-hosted.yaml
    volumes:
      # Model cache. Persisting it keeps restarts offline-capable.
      - facilitator_models:/app/.models
    ports:
      - "4022:4022"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  facilitator_postgres:
  facilitator_models:

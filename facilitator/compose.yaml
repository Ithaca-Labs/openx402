services:
  postgres:
    # pgvector ships the extension semantic search needs. Plain postgres:17
    # also works: the facilitator then runs lexical-only and says so in
    # /health/ready.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: facilitator
      POSTGRES_USER: facilitator
      POSTGRES_PASSWORD: facilitator-development-only
    volumes:
      - facilitator_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facilitator -d facilitator"]
      interval: 2s
      timeout: 2s
      retries: 20

  facilitator:
    build:
      context: ..
      dockerfile: facilitator/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://facilitator:facilitator-development-only@postgres:5432/facilitator
      FACILITATOR_CONFIG: config/self-hosted.yaml
    volumes:
      # Model cache. Persisting it keeps restarts offline-capable.
      - facilitator_models:/app/.models
    ports:
      - "${FACILITATOR_PORT:-4022}:4022"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional agent-facing MCP server. Never required for the facilitator to
  # start -- enable with `docker compose --profile mcp up`. Talks to the
  # facilitator above only over its public HTTP API (FACILITATOR_URL) and
  # shares the same PostgreSQL instance via its own DATABASE_URL, but is a
  # separate process with its own image, config and (optional) signer.
  mcp-server:
    profiles: ["mcp"]
    build: ../mcp-server
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://facilitator:facilitator-development-only@postgres:5432/facilitator
      FACILITATOR_URL: http://facilitator:4022
      MCP_SERVER_CONFIG: config/self-hosted.yaml
    ports:
      - "4522:4522"
    depends_on:
      postgres:
        condition: service_healthy
      facilitator:
        condition: service_started
    restart: unless-stopped

volumes:
  facilitator_postgres:
  facilitator_models:

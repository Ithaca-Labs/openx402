# Default self-hosted profile: local stdio agent runtime, discovery-only
# (search/get tools) unless a signer is explicitly configured. Never enables
# stellar:pubnet -- see docs/SMART-ACCOUNTS.md and README.md before turning
# that on. Layered like the facilitator's own config: this file, then
# environment-variable overrides for anything under `*_env`.

facilitator:
  base_url: http://localhost:4022
  request_timeout_ms: 10000

transport: stdio

http:
  port: 4522
  # Comma-separated bearer keys read from this env var. Required for any
  # non-stdio transport once a signer is configured -- see config.ts.
  api_keys_env: MCP_SERVER_API_KEYS

signer:
  mode: none
  # mode: env-secret        # stdio only
  # secret_env: STELLAR_SECRET_KEY
  # mode: external           # remote transports
  # base_url: https://signer.internal
  # auth_header_env: MCP_SIGNER_AUTH_HEADER
  # mode: encrypted-key      # remote transports
  # keystore_path: /run/secrets/mcp-signer-keystore.json
  # encryption_key_env: MCP_SIGNER_ENCRYPTION_KEY

networks:
  stellar:testnet:
    enabled: true
  stellar:pubnet:
    enabled: false

budget:
  store: memory
  database_url_env: DATABASE_URL
  default_per_call_max_atomic: "1000000"
  default_session_or_day_max_atomic: "50000000"

network_security:
  allow_insecure_local: false
  max_response_bytes: 8388608
  timeout_ms: 15000
  max_redirects: 3
  max_concurrent_connections: 10
  resolved_mcp_endpoints: {}
